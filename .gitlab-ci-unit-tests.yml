# Detached unit-test pipeline: the MR pipeline does not wait for its result.
stages:
  - warm
  - test

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "parent_pipeline"

variables:
  GOPATH: $CI_PROJECT_DIR/.go
  GOMODCACHE: $CI_PROJECT_DIR/.go/pkg/mod
  GOCACHE: $CI_PROJECT_DIR/.cache/go-build

# Keep test cache separate from lint: both build concurrently and would race
# to upload the same archive if they shared a key.
.test-go-cache: &test-go-cache
  key:
    files:
      - go.sum
    prefix: test-go
  paths:
    - .go/pkg/mod
    - .cache/go-build

# Seed both module and compiled build caches before starting the test shards.
test-cache-warm:
  stage: warm
  rules:
    - if: '$TEST_DIAGNOSTIC_ONLY == "true"'
      when: never
    - when: on_success
  image: $IMAGE_GO_TRIXIE
  tags:
    - linux-x86-16cpu-32gb
  timeout: 45 minutes
  allow_failure: true
  cache:
    <<: *test-go-cache
    policy: pull-push
  script:
    - ./scripts/bootstrap
    - go build ./...

# Mirrors the GitHub "test" job, sharded 16 ways via GitLab's parallel jobs.
# Wait for the cache upload, but run even if warming fails (cold-cache fallback).
test:
  stage: test
  rules:
    - if: '$TEST_DIAGNOSTIC_ONLY == "true"'
      when: never
    - when: on_success
  image: $IMAGE_GO_TRIXIE
  tags:
    - linux-x86-8cpu-16gb
  needs:
    - job: test-cache-warm
      artifacts: false
  timeout: 75 minutes
  allow_failure: true
  parallel: 16
  cache:
    <<: *test-go-cache
    policy: pull
  script:
    - ./scripts/bootstrap
    - |
      # Select this shard's packages (1-indexed), matching the GitHub sharding logic.
      packages=$(go list ./... | awk "NR % $CI_NODE_TOTAL == ($CI_NODE_INDEX - 1)")
      if [ -n "$packages" ]; then
        echo "$packages" | xargs go test -v -timeout 25m
      fi

# Run one representative shard against the existing cache, without launching
# the warmer or the other 15 shards. Log progress while Go is otherwise quiet.
test-diagnostic:
  stage: test
  rules:
    - if: '$TEST_DIAGNOSTIC_ONLY == "true"'
  image: $IMAGE_GO_TRIXIE
  tags:
    - linux-x86-8cpu-16gb
  timeout: 75 minutes
  allow_failure: true
  cache:
    <<: *test-go-cache
    policy: pull
  script:
    - ./scripts/bootstrap
    - |
      echo "Diagnostic shard 3/16 with go test -p 2; Go version: $(go version)"
      echo "GOMAXPROCS=${GOMAXPROCS:-unset}; GOFLAGS=${GOFLAGS:-unset}"
      (
        while :; do
          echo "[diag] snapshot $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          for metric in cpu.max cpu.stat cpu.pressure memory.current memory.max memory.events memory.pressure io.pressure io.stat; do
            file="/sys/fs/cgroup/$metric"
            if [ -r "$file" ]; then
              printf '[diag] %s: ' "$metric"
              tr '\n' ' ' < "$file"
              printf '\n'
            fi
          done
          if [ -r /sys/fs/cgroup/memory.stat ]; then
            awk '$1 == "anon" || $1 == "file" || $1 == "slab" || $1 == "pgmajfault" || $1 == "pgscan" || $1 == "pgsteal" { printf "%s=%s ", $1, $2 } END { print "" }' /sys/fs/cgroup/memory.stat
          fi
          df -h . || true
          sleep 60
        done
      ) &
      monitor_pid=$!
      trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT

      started=$(date +%s)
      all_packages=$(go list ./...)
      echo "[diag] go list ./... finished in $(($(date +%s) - started))s"
      packages=$(printf '%s\n' "$all_packages" | awk 'NR % 16 == 2')
      test -n "$packages" || { echo '[diag] shard 3 has no packages'; exit 1; }
      echo "[diag] selected $(printf '%s\n' "$packages" | wc -l) packages"
      first_package=$(printf '%s\n' "$packages" | awk 'NR == 1 { print; exit }')
      echo "[diag] compiling first test package: $first_package"
      started=$(date +%s)
      go test -c -o /dev/null "$first_package"
      echo "[diag] first test binary compiled in $(($(date +%s) - started))s"

      echo '[diag] running shard 3 tests'
      started=$(date +%s)
      printf '%s\n' "$packages" | xargs go test -p 2 -v -timeout 25m
      echo "[diag] shard 3 tests finished in $(($(date +%s) - started))s"
