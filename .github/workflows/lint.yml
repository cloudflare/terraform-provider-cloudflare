name: Lint
on: [pull_request]

permissions:
  contents: read
  pull-requests: read

jobs:
  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for `only-new-issues` to compare diffs
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Must track the provider module: golangci-lint loads packages with
          # this toolchain, so it has to satisfy go.mod's directive.
          go-version-file: 'go.mod'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # v2 is required to analyze a module targeting Go 1.27; the v1 line
          # is built with Go 1.24 and refuses newer targets.
          version: v2.15.0
          args: "--config .golintci.yml"
          only-new-issues: true

  tfproviderlint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # tfproviderlintx analyzes the provider module, so the toolchain must
          # satisfy go.mod's directive and understand its export data.
          go-version-file: 'go.mod'
      - run: make terraform-provider-lint
